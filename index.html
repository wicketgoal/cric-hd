<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stream Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: Arial, sans-serif; text-align: center;}
    iframe { width: 100%; height: 100vh; border: none;}
    .msg { padding: 20px; font-size: 18px;}
  </style>
</head>
<body>

<div id="container">
  <div class="msg">⏳ Loading stream…</div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const src = params.get("src");

  if (!src) {
    document.getElementById("container").innerHTML =
      "<div class='msg'>❌ No stream source provided! Add ?src=STREAM_URL</div>";
  } else {
    document.getElementById("container").innerHTML =
      `<iframe src="${src}" allowfullscreen allow="autoplay"></iframe>`;
  }
</script>

</body>
</html>
