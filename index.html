<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CRIC HD LIVE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    background: radial-gradient(circle at top, #111 0%, #000 70%);
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }

  iframe {
    width: 100%;
    height: 100vh;
    border: none;
  }

  /* Waiting Screen */
  .waiting {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .pulse {
    font-size: 26px;
    letter-spacing: 2px;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%   { opacity: 0.3; }
    50%  { opacity: 1; }
    100% { opacity: 0.3; }
  }

  .loader {
    margin-top: 30px;
    width: 70px;
    height: 70px;
    border: 6px solid #222;
    border-top: 6px solid #ff0000;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .note {
    margin-top: 25px;
    font-size: 14px;
    color: #aaa;
  }

  .live-dot {
    color: red;
    animation: blink 1s infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>

<body>

<div id="app"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const src = params.get("src");
  const app = document.getElementById("app");

  if (!src) {
    // MATCH NOT STARTED SCREEN
    app.innerHTML = `
      <div class="waiting">
        <div class="pulse">MATCH HASN'T STARTED YET</div>
        <div class="loader"></div>
        <div class="note">
          Stream will go LIVE soon <span class="live-dot">●</span><br>
          Please stay tuned
        </div>
      </div>
    `;
  } else {
    // STREAM PLAYER
    app.innerHTML = `
      <iframe src="${src}" allow="autoplay; fullscreen" allowfullscreen></iframe>
    `;
  }
</script>

</body>
</html>
