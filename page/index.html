<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cric HD Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f172a;
  --card:#111827;
  --text:#e5e7eb;
  --accent:#22c55e;
}
.light{
  --bg:#f1f5f9;
  --card:#ffffff;
  --text:#020617;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}

body{
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header{
  background:#020617;
  padding:12px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
header img{height:40px}
.header-btns button{
  background:#1f2933;
  color:#fff;
  border:none;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
}

/* LAYOUT */
.main{
  display:grid;
  grid-template-columns:120px 1fr 120px;
  gap:10px;
  padding:10px;
}
.sidebar img{
  width:100%;
  border-radius:10px;
  margin-bottom:10px;
}

/* PLAYER */
.player-box{
  background:var(--card);
  padding:12px;
  border-radius:14px;
}
video, iframe{
  width:100%;
  height:360px;
  border-radius:12px;
  background:black;
}

/* INFO BUTTON */
.info-btn{
  margin-top:10px;
  background:#1f2937;
  color:#e5e7eb;
  padding:12px;
  text-align:center;
  border-radius:10px;
  font-size:14px;
}

/* ACTION BUTTONS */
.actions{
  display:flex;
  gap:10px;
  margin-top:10px;
}
.actions button{
  flex:1;
  background:var(--accent);
  color:#022c22;
  border:none;
  padding:10px;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}

/* CHAT */
.chat{
  margin-top:12px;
  height:260px;
  border-radius:12px;
  overflow:hidden;
  background:#020617;
}

/* FOOTER */
footer{
  margin:15px;
  text-align:center;
  font-size:12px;
  opacity:.7;
}

@media(max-width:768px){
  .main{grid-template-columns:1fr}
  .sidebar{display:none}
  video,iframe{height:220px}
}
</style>
</head>

<body>

<header>
  <img src="https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo_TV_2015.png">
  <div class="header-btns">
    <button onclick="toggleMode()">🌙</button>
    <button onclick="location.reload()">⟳ Refresh</button>
  </div>
</header>

<div class="main">

  <!-- LEFT ADS -->
  <div class="sidebar">
    <img src="https://via.placeholder.com/120x300?text=Ad">
    <img src="https://via.placeholder.com/120x300?text=Ad">
  </div>

  <!-- CENTER -->
  <div class="player-box">

    <!-- VIDEO -->
    <video id="player" controls autoplay muted></video>

    <!-- LOADING MESSAGE BUTTON -->
    <div class="info-btn">
      ⏳ Loading stream… If buffering occurs, refresh or try another link
    </div>

    <!-- ACTION BUTTONS -->
    <div class="actions">
      <button onclick="location.reload()">🔄 Refresh Stream</button>
      <button onclick="alert('Try another source')">🔁 Other Links</button>
    </div>

    <!-- CHAT -->
    <div class="chat">
      <iframe
        src="https://tlk.io/crichd?theme=dark"
        width="100%"
        height="100%"
        frameborder="0">
      </iframe>
    </div>

  </div>

  <!-- RIGHT ADS -->
  <div class="sidebar">
    <img src="https://via.placeholder.com/120x300?text=Ad">
    <img src="https://via.placeholder.com/120x300?text=Ad">
  </div>

</div>

<footer>
  DMCA: This site does not host any video streams. All streams are provided by third-party sources.
</footer>

<script>
function toggleMode(){
  document.body.classList.toggle("light");
}

/* SRC HANDLER */
const url = new URLSearchParams(window.location.search);
const src = url.get("src");

if(src){
  document.getElementById("player").src = src;
}
</script>

</body>
</html>
