<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YoNoTV – Live Stream</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f5f5f5;
  color:#000;
}
body.dark{
  background:#0f0f0f;
  color:#fff;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:10px;
}

header{
  text-align:center;
  padding:10px 0;
}

header img{
  height:55px;
}

.controls{
  text-align:center;
  margin:10px 0;
}

.controls button{
  padding:8px 14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  margin:0 5px;
}

.refresh{ background:#ff0000; color:#fff; }
.darkbtn{ background:#0066ff; color:#fff; }

.notice{
  text-align:center;
  background:#ddd;
  padding:8px;
  border-radius:6px;
  margin-bottom:10px;
}
body.dark .notice{ background:#222; }

.player-wrap{
  position:relative;
  width:100%;
  height:0;
  padding-top:56.25%;
  background:#000;
  border-radius:12px;
  overflow:hidden;
}

.player-wrap iframe{
  position:absolute;
  top:0; left:0;
  width:100%;
  height:100%;
  border:none;
}

.side-ads{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.side-ads img{
  width:49%;
  border-radius:8px;
}

.chat{
  text-align:center;
  margin:15px 0;
}

.chat button{
  background:#007bff;
  color:#fff;
  border:none;
  padding:10px 20px;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
}

.footer{
  background:#e0e0e0;
  padding:15px;
  border-radius:10px;
  font-size:14px;
  margin-top:15px;
}
body.dark .footer{ background:#1a1a1a; }
</style>
</head>

<body>

<div class="container">

<header>
  <img src="/logo.png" alt="Logo">
</header>

<div class="controls">
  <button class="refresh" onclick="location.reload()">Refresh</button>
  <button class="darkbtn" onclick="toggleDark()">Dark Mode</button>
</div>

<div class="notice">
  Loading stream… If buffering occurs, refresh or try another link
</div>

<div class="player-wrap">
  <iframe id="frame" allowfullscreen allow="autoplay; encrypted-media"></iframe>
</div>

<div class="chat">
  <button onclick="alert('Chat system coming soon')">💬 LIVE CHAT</button>
</div>

<div class="footer">
<b>Legal Disclaimer</b><br><br>
YoNoTV does not host any video content. All streams are embedded from publicly available third-party sources.<br><br>
DMCA: yonotvlive@gmail.com
</div>

</div>

<script>
function toggleDark(){
  document.body.classList.toggle("dark");
}

const params = new URLSearchParams(window.location.search);
const src = params.get("src");

if(src){
  document.getElementById("frame").src = decodeURIComponent(src);
}
</script>

</body>
</html>
