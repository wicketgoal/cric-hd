<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRIC HD - Stream Page</title>
<style>
/* ===== Reset & Global ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #111; color: #fff; }

/* ===== Header ===== */
header {
  background: #222;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #444;
}
header img { height: 50px; }
header nav a {
  color: #fff;
  text-decoration: none;
  margin-left: 15px;
  font-weight: bold;
}
header nav a:hover { color: #ff0000; }

/* ===== Video Player ===== */
#player-container {
  display: flex;
  justify-content: center;
  margin: 20px auto;
  max-width: 900px;
  position: relative;
}
video, iframe {
  width: 100%;
  height: 500px;
  border-radius: 8px;
  background: #000;
}

/* ===== Sections ===== */
section {
  max-width: 900px;
  margin: 20px auto;
  padding: 15px;
  background: #222;
  border-radius: 8px;
}

/* ===== DMCA ===== */
footer {
  text-align: center;
  padding: 15px;
  font-size: 14px;
  background: #222;
  margin-top: 20px;
  border-top: 1px solid #444;
}

/* ===== Chat Box ===== */
#chat-box {
  max-width: 900px;
  margin: 20px auto;
  padding: 10px;
  background: #111;
  border: 1px solid #444;
  border-radius: 8px;
  height: 300px;
  overflow-y: auto;
}
#chat-input {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 5px;
  border: none;
  background: #222;
  color: #fff;
}

/* Responsive */
@media(max-width:768px){
  video, iframe { height: 250px; }
}
</style>
</head>
<body>

<!-- Header -->
<header>
  <img src="https://via.placeholder.com/150x50?text=CRIC+HD" alt="Logo">
  <nav>
    <a href="/">Home</a>
    <a href="/page">Stream</a>
    <a href="/player?id=willow">Live</a>
  </nav>
</header>

<!-- Video Player -->
<div id="player-container">
  <video id="videoPlayer" controls autoplay playsinline></video>
  <iframe id="iframeViewer" style="display:none;"></iframe>
</div>

<!-- Optional Sections -->
<section>
  <h3>About This Stream</h3>
  <p>Watch the live match here. Stay tuned for updates and highlights.</p>
</section>

<!-- Chat Box -->
<section>
  <h3>Live Chat</h3>
  <div id="chat-box">Chat feature coming soon...</div>
  <input type="text" id="chat-input" placeholder="Type your message...">
</section>

<!-- DMCA Notice -->
<footer>
  ⚠️ DMCA Notice: All content is for personal use only. © 2026 CRIC HD
</footer>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0"></script>
<script>
const params = new URLSearchParams(window.location.search);
const src = params.get("src");

const video = document.getElementById("videoPlayer");
const iframe = document.getElementById("iframeViewer");

if(src){
  const isHLS = src.toLowerCase().includes(".m3u8");
  const videoExt = ["mp4","webm","ogg","mov","mkv"];
  const isVideo = videoExt.some(ext => src.toLowerCase().includes(ext));

  if(isHLS || isVideo){
    video.style.display = "block";
    if(isHLS && Hls.isSupported()){
      const hls = new Hls();
      hls.loadSource(src);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else {
      video.src = src;
      video.addEventListener("loadeddata", () => video.play());
    }
  } else {
    iframe.style.display = "block";
    iframe.src = src;
  }
}
</script>

</body>
</html>
